<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Админ-панель (объявление)</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" href="/styles/layout.css">
  <link rel="stylesheet" href="/styles/index.css">
  <link rel="stylesheet" href="/styles/admin_announcement.css">
</head>

<body>
  <div class="site-container">
    <header class="header">
      <a href="index.html" class="logo-button">ДЕЛЬТА</a>
      <p class="nav-link">Внутренний портал</p>
      <div class="header-buttons">
        <a href="notifications.html" class="action-button">Уведомления</a>
        <a href="profile.html" class="action-button">Профиль</a>
      </div>
    </header>

    <main class="main-content">
      <h1 class="aa-page-title">Админ-панель (объявление)</h1>

      <section class="aa-panel" aria-label="Объявление">
        <h2 class="aa-panel-title">Объявление всем сотрудникам</h2>

        <div class="aa-textbox">
          <p id="viewText" class="aa-text">Загрузка...</p>
          <textarea id="editText" class="aa-textarea" style="display:none"
            placeholder="Введите текст объявления..."></textarea>
        </div>

        <div class="aa-actions">
          <button id="editBtn" class="aa-btn" type="button">Изменить</button>

          <div id="editActions" class="aa-edit-actions" style="display:none">
            <button id="saveBtn" class="aa-btn" type="button">Сохранить</button>
            <button id="cancelBtn" class="aa-btn aa-btn-secondary" type="button">Отмена</button>
          </div>
        </div>

        <p id="status" class="aa-status"></p>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-column footer-left">
        <a href="privacy.doc" download class="privacy-link">Политика конфиденциальности</a>
      </div>

      <div class="footer-column footer-center">
        <nav class="footer-nav">
          <a href="index.html" class="footer-nav-button">Главная</a>
          <a href="/tasks" class="footer-nav-button">Задачи</a>
          <a href="documents.html" class="footer-nav-button">Документы</a>
          <a href="contacts.html" class="footer-nav-button">Контакты</a>
          <a href="profile.html" class="footer-nav-button">Профиль</a>
          <a href="admin-panel.html" class="footer-nav-button">А-панель</a>
        </nav>
      </div>

      <div class="footer-right">
        <h3 class="footer-title">Политика</h3>
        <p class="footer-text">2025 © Все права защищены. Внутренние стандарты безопасности и конфиденциальности.</p>
      </div>
    </footer>
  </div>

  <script>
    const viewText = document.getElementById('viewText');
    const editText = document.getElementById('editText');
    const statusEl = document.getElementById('status');

    const editBtn = document.getElementById('editBtn');
    const saveBtn = document.getElementById('saveBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const editActions = document.getElementById('editActions');

    const MAX_CHARS = 220; // ограничение длины (под 5 строк в 20px)
    let original = '';

    function clampValue(v) {
      v = v || '';
      if (v.length > MAX_CHARS) {
        v = v.slice(0, MAX_CHARS);
      }
      return v;
    }

    function setMode(editing) {
      viewText.style.display = editing ? 'none' : 'block';
      editText.style.display = editing ? 'block' : 'none';

      editBtn.style.display = editing ? 'none' : 'inline-flex';
      editActions.style.display = editing ? 'flex' : 'none';

      statusEl.textContent = '';
    }

    async function loadAnnouncement() {
      const r = await fetch('/api/announcement', { credentials: 'include' });
      if (!r.ok) { viewText.textContent = 'Не удалось загрузить'; return; }
      const data = await r.json();

      original = clampValue((data.text || '').trim());
      viewText.textContent = original || 'На данный момент объявлений нет';
      editText.value = original;
    }

    editBtn.addEventListener('click', () => {
      editText.value = original;
      setMode(true);
      editText.focus();
    });

    cancelBtn.addEventListener('click', () => {
      setMode(false);
    });

    editText.addEventListener('input', () => {
      const v = clampValue(editText.value);
      if (v !== editText.value) editText.value = v;
    });

    saveBtn.addEventListener('click', async () => {
      const text = clampValue(editText.value.trim());
      statusEl.textContent = 'Сохранение...';

      const r = await fetch('/api/admin/announcement', {
        method: 'PUT',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });

      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        statusEl.textContent = err.error || 'Ошибка сохранения';
        return;
      }

      await loadAnnouncement();
      setMode(false);
      statusEl.textContent = 'Сохранено';
      setTimeout(() => statusEl.textContent = '', 1200);
    });

    setMode(false);
    loadAnnouncement();
  </script>
</body>
</html>
