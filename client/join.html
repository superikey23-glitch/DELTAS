<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/layout.css">
    <link rel="stylesheet" href="/styles/join.css">
</head>

<body>
<div class="site-container">

    <!-- HEADER -->
    <header class="header">
        <a href="/" class="logo-button">LTS</a>
    </header>

    <!-- MAIN -->
    <main class="main-content">
        <div class="login-shell">

            <!-- Заголовок как в макете -->
            <h1 class="login-title">Вход</h1>

            <form id="loginForm" class="login-form">

                <div class="login-card">

                    <label class="login-field">
                        Логин
                        <input type="text" id="username" required placeholder="Логин" autocomplete="username">
                    </label>

                    <label class="login-field">
                        Пароль
                        <input type="password" id="password" required placeholder="Пароль" autocomplete="current-password">
                    </label>

                </div>

                <button type="submit" class="login-btn">Войти</button>

                <p id="error" class="login-error"></p>

            </form>

        </div>
    </main>

</div>

<script>
document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();

    const res = await fetch('/api/login', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            username: username.value,
            password: password.value
        })
    });

    const data = await res.json();

    if (!res.ok) {
        error.textContent = data.error || 'Ошибка входа';
        return;
    }

    location.href = '/';
};
</script>

</body>
</html>
