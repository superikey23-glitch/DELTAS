<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>А-панель — уведомления</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" href="/styles/layout.css">
  <link rel="stylesheet" href="/styles/admin_notify.css">
</head>

<body>
<div class="site-container">

  <header class="header">
    <a href="/" class="logo-button">ДЕЛЬТА</a>
    <p class="nav-link">Внутренний портал</p>
    <div class="header-buttons">
      <a href="notifications.html" class="action-button">Уведомления</a>
      <a href="profile.html" class="action-button">Профиль</a>
    </div>
  </header>

  <main class="main-content">

    <h1 class="an-title">Админ-панель (уведомления)</h1>

    <section class="an-panel">
      <form id="sendForm" class="an-form">

        <!-- SELECT с автошириной -->
        <div class="an-select-wrap an-to">
          <select id="userSelect" class="an-select" required>
            <option value="">Загрузка...</option>
          </select>
        </div>

        <input id="title" class="an-input an-subject"
               placeholder="Введите заголовок (до 45 символов)"
               maxlength="45" required>

        <textarea id="body" class="an-textarea"
                  placeholder="Сообщение..." required></textarea>

        <button type="submit" class="an-btn">Отправить</button>

        <div id="msg" class="an-msg" aria-live="polite"></div>

      </form>
    </section>

  </main>

  <footer class="footer">
    <div class="footer-column footer-left">
      <a href="privacy.doc" download class="privacy-link">Политика конфиденциальности</a>
    </div>

    <div class="footer-column footer-center">
      <nav class="footer-nav">
        <a href="index.html" class="footer-nav-button">Главная</a>
        <a href="/tasks" class="footer-nav-button">Задачи</a>
        <a href="documents.html" class="footer-nav-button">Документы</a>
        <a href="contacts.html" class="footer-nav-button">Контакты</a>
        <a href="profile.html" class="footer-nav-button">Профиль</a>
        <a href="admin-panel.html" class="footer-nav-button">А-панель</a>
      </nav>
    </div>

    <div class="footer-right">
      <h3 class="footer-title">Политика</h3>
      <p class="footer-text">2025 © Все права защищены. Внутренние стандарты безопасности и конфиденциальности.</p>
    </div>
  </footer>

</div>

<script>
const form = document.getElementById('sendForm');
const msg = document.getElementById('msg');
const userSelect = document.getElementById('userSelect');
const titleEl = document.getElementById('title');
const bodyEl = document.getElementById('body');

let users = [];

/* загрузка пользователей */
async function loadUsers() {
  try {
    const res = await fetch('/api/users', { credentials: 'include' });

    if (!res.ok) {
      userSelect.innerHTML = '<option value="">Ошибка загрузки</option>';
      return;
    }

    users = await res.json();

    userSelect.innerHTML = '<option value="">Выберите пользователя</option>';

    users.forEach(u => {
      const option = document.createElement('option');
      option.value = u.id;
      option.textContent = `${u.fullname || ''} (${u.username})`;
      userSelect.appendChild(option);
    });

    updateSelectWidth();

  } catch (_) {
    userSelect.innerHTML = '<option value="">Ошибка</option>';
  }
}

function updateSelectWidth() {
  const opt = userSelect.options[userSelect.selectedIndex];
  const text = (opt ? opt.textContent : '') || '';

  const cs = getComputedStyle(userSelect);

  const span = document.createElement('span');
  span.style.position = 'absolute';
  span.style.visibility = 'hidden';
  span.style.whiteSpace = 'nowrap';
  span.style.fontFamily = cs.fontFamily;
  span.style.fontSize = cs.fontSize;
  span.style.fontWeight = cs.fontWeight;
  span.style.letterSpacing = cs.letterSpacing;
  span.textContent = text;

  document.body.appendChild(span);
  const textW = Math.ceil(span.getBoundingClientRect().width);
  document.body.removeChild(span);

  const minW = 270;
  const maxW = 1038;

  // точно под наши padding: left 16 + right 44 (под стрелку) + небольшой запас
  const w = textW + 16 + 40 ;

  const wrap = document.querySelector('.an-select-wrap.an-to');
  wrap.style.width = Math.max(minW, Math.min(maxW, w)) + 'px';
}


userSelect.addEventListener('change', updateSelectWidth);

/* отправка */
form.onsubmit = async (e) => {
  e.preventDefault();
  msg.textContent = '';
  msg.classList.remove('ok', 'err');

  if (!userSelect.value) {
    msg.textContent = 'Выберите пользователя';
    msg.classList.add('err');
    return;
  }

  const res = await fetch('/api/admin/notifications', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({
      userId: userSelect.value,
      title: titleEl.value,
      body: bodyEl.value
    })
  });

  const data = await res.json().catch(()=> ({}));

  if (!res.ok) {
    msg.textContent = data.error || 'Ошибка отправки';
    msg.classList.add('err');
    return;
  }

  msg.textContent = 'Уведомление отправлено!';
  msg.classList.add('ok');
  form.reset();
  updateSelectWidth();
};

loadUsers();
</script>

</body>
</html>
