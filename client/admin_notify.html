<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>А-панель — уведомления</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" href="/styles/layout.css">

  <style>
    .ap-shell{
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 40px 16px 60px;
    }

    .ap-card{
      width: min(700px, 100%);
      background: #FEF9C3;
      border: 1px solid #E5E7EB;
      border-radius: 11px;
      padding: 24px;
      box-sizing: border-box;
    }

    .ap-title{
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 22px;
      text-align: center;
      color: #374151;
      margin-bottom: 22px;
    }

    .ap-field{
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .ap-field label{
      font-weight: 700;
      font-size: 14px;
      color: #334230;
    }

    .ap-field input,
    .ap-field textarea,
    .ap-field select{
      width: 100%;
      border: 1px solid #E5E7EB;
      border-radius: 9px;
      padding: 12px 14px;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      background: #FEFFEF;
      outline: none;
      box-sizing: border-box;
    }

    .ap-btn{
      width: 240px;
      height: 45px;
      background: #EAB308;
      border: none;
      border-radius: 9px;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      display: block;
      margin: 10px auto 0;
    }

    .ap-btn:hover{
      filter: brightness(0.95);
    }

    .ap-msg{
      text-align: center;
      margin-top: 14px;
      font-weight: 700;
    }
  </style>
</head>

<body>
<div class="site-container">

  <!-- HEADER -->
  <header class="header">
    <a href="/" class="logo-button">ДЕЛЬТА</a>
    <p class="nav-link">Внутренний портал</p>
    <div class="header-buttons">
      <a href="notifications.html" class="action-button">Уведомления</a>
      <a href="profile.html" class="action-button">Профиль</a>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main-content">
    <div class="ap-shell">
      <div class="ap-card">

        <div class="ap-title">Отправка уведомления</div>

        <form id="sendForm">

          <div class="ap-field">
            <label for="userSelect">Кому отправить</label>
            <select id="userSelect" required>
              <option value="">Загрузка...</option>
            </select>
          </div>

          <div class="ap-field">
            <label for="title">Заголовок</label>
            <input id="title" required maxlength="45" placeholder="Введите заголовок (до 45 символов)">
          </div>

          <div class="ap-field">
            <label for="body">Описание</label>
            <textarea id="body" rows="4" required placeholder="Введите текст уведомления"></textarea>
          </div>

          <button type="submit" class="ap-btn">Отправить</button>

          <div id="msg" class="ap-msg"></div>

        </form>

      </div>
    </div>
  </main>

</div>

<script>
const form = document.getElementById('sendForm');
const msg = document.getElementById('msg');
const userSelect = document.getElementById('userSelect');

/* Загрузка пользователей */
async function loadUsers() {
  try {
    const res = await fetch('/api/users', {
      credentials: 'include'
    });

    if (!res.ok) {
      userSelect.innerHTML = '<option value="">Ошибка загрузки</option>';
      return;
    }

    const users = await res.json();

    userSelect.innerHTML = '<option value="">Выберите пользователя</option>';

    users.forEach(u => {
      const option = document.createElement('option');
      option.value = u.id;
      option.textContent = `${u.fullname} (${u.username})`;
      userSelect.appendChild(option);
    });

  } catch (e) {
    userSelect.innerHTML = '<option value="">Ошибка</option>';
  }
}

/* Отправка уведомления */
form.onsubmit = async (e) => {
  e.preventDefault();
  msg.textContent = '';
  msg.style.color = '';

  const res = await fetch('/api/admin/notifications', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({
      userId: userSelect.value,
      title: title.value,
      body: body.value
    })
  });

  const data = await res.json().catch(()=> ({}));

  if (!res.ok) {
    msg.style.color = 'red';
    msg.textContent = data.error || 'Ошибка отправки';
    return;
  }

  msg.style.color = '#334230';
  msg.textContent = 'Уведомление отправлено!';
  form.reset();
};

loadUsers();
</script>

</body>
</html>
