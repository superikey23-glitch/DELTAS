<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Документы — Внутренний портал</title>

    <!-- Шрифты -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

    <!-- Общие стили сайта -->
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/layout.css">
    <link rel="stylesheet" href="/styles/documents.css">
    <script>
    const token = localStorage.getItem('token');

    if (!token) {
        window.location.href = '/login';
    }
</script>
</head>
<body>

<div class="site-container">

    <!-- ===== ШАПКА ===== -->
    <header class="header">
        <a href="index.html" class="logo-button">LTS</a>

        <p class="nav-link nav-title">Внутренний портал</p>

        <div class="header-buttons">
            <a href="notifications.html" class="action-button">Уведомления</a>
            <a href="profile.html" class="action-button">Профиль</a>
        </div>
    </header>

    <!-- ===== ОСНОВНОЕ СОДЕРЖИМОЕ ===== -->
    <main class="main-content documents-page">

        <!-- Заголовок страницы -->
        <section class=" documents-header">
            <h1 class="section-title documents-title">Документы</h1>
        </section>

        <!-- СОРТИРОВКА -->
        <section class="documents-sorting">
        <div class="documents-filters" id="controls">

            <div class="controls-block" data-kind="sort">
            <button type="button" class="documents-filter active" data-sort="new">Новые</button>
            <button type="button" class="documents-filter inactive" data-sort="old">Старые</button>
            <button type="button" class="documents-filter inactive" data-sort="name">Имя</button>
            </div>

            <span class="controls-sep">|</span>

            <div class="controls-block" data-kind="filter">
            <button type="button" class="documents-filter active" data-filter="all">Все</button>
            <button type="button" class="documents-filter inactive" data-filter="PDF">PDF</button>
            <button type="button" class="documents-filter inactive" data-filter="DOC">DOC</button>
            <button type="button" class="documents-filter inactive" data-filter="DOCX">DOCX</button>
            <button type="button" class="documents-filter inactive" data-filter="XLS">XLS</button>
            <button type="button" class="documents-filter inactive" data-filter="JPEG">JPEG</button>
            <button type="button" class="documents-filter inactive" data-filter="PNG">PNG</button>
            </div>

        </div>
        </section>

        <!-- СЕТКА ДОКУМЕНТОВ -->
        <section class="documents-section documents-list">
            <div class="documents-grid" id="documents-grid">
                <!-- Карточки документов (JS) -->
            </div>
        </section>

        <!-- СОЗДАНИЕ ДОКУМЕНТА -->
        <section class="documents-section documents-create">

            <!-- КНОПКА ОТКРЫТИЯ -->
            <div id="documents-grid" class="documents-grid">
            <div id="open-create-form" class="document-card new-document-card" role="button" tabindex="0">
                <div class="new-card-inner">
                <div class="plus-icon" aria-hidden="true">
                    <div class="plus-horizontal"></div>
                    <div class="plus-vertical"></div>
                </div>
                <div class="new-card-text">Добавить документ</div>
                </div>
            </div>

            <!-- ⚠️ create-form НЕ МЕНЯЕМ (он уже есть в твоём HTML) -->
            <!-- просто оставь его как есть, скрипт сам будет вставлять/убирать его из grid -->
            </div>

            <!-- ФОРМА СОЗДАНИЯ (СКРЫТА) -->
            <div
                class="document-create-card document-card document-card--create"
                id="create-form"
                style="display:none;">

                <h3 class="document-create-title">Новый документ</h3>

                <input
                    type="text"
                    id="new-name"
                    class="document-input"
                    placeholder="Название документа">

                <input
                    type="file"
                    id="new-file"
                    class="document-input">

                <div class="create-actions document-actions">
                    <button class="document-btn document-btn--save" id="create-btn">
                        Создать
                    </button>
                    <button class="document-btn document-btn--cancel" id="cancel-create">
                        Отмена
                    </button>
                </div>

            </div>

        </section>

    </main>

    <!-- ===== ПОДВАЛ ===== -->
    <footer class="footer">

        <div class="footer-column footer-left">
            <a href="img/privacy.docx" download class="privacy-link">
                Политика конфиденциальности
            </a>
        </div>

        <div class="footer-column footer-center">
            <nav class="footer-nav">
                <a href="index.html" class="footer-nav-button">Главная</a>
                <a href="/tasks" class="footer-nav-button">Задачи</a>
                <a href="documents.html" class="footer-nav-button">Документы</a>
                <a href="contacts.html" class="footer-nav-button">Контакты</a>
                <a href="profile.html" class="footer-nav-button">Профиль</a>
                <a href="admin-panel.html" class="footer-nav-button">А-панель</a>
            </nav>
        </div>

        <div class="footer-right">
            <h3 class="footer-title">Политика</h3>
            <p class="footer-text">
                2026 © Все права защищены. Внутренние стандарты безопасности и конфиденциальности.
            </p>
        </div>

    </footer>

</div>

<!-- JS -->
<script src="/js/documents.js"></script>

</body>
</html>
